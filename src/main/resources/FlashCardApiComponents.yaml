components:
  schemas:
    Deck:
      type: object
      required:
        - name
        - cardIds
      properties:
        deckId:
          type: string
        name:
          type: string
        cardIds:
          type: array
          items:
            type: string

    FlashCard:
      type: object
      properties:
        id:
          type: string
        front:
          type: string
        back:
          type: string

    ResponseObject:
      type: object
      properties:
        body:
          type: object
        error:
          type: string

    FlashCardResponseObject:
      type: object
      properties:
        body:
          type: object
          $ref: '#/components/schemas/FlashCard'
        error:
          type: string

    FlashCardListResponseObject:
      type: object
      properties:
        body:
          type: array
          items:
            $ref: '#/components/schemas/FlashCard'
        error:
          type: string

    OperationStatus:
      type: object
      properties:
        isSuccessful:
          type: boolean
        deckId:
          type: string
        flashCardId:
          type: string
        error:
          type: string
        timestamp:
          type: string