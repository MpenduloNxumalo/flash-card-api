components:
  schemas:
    Deck:
      type: object
      required:
        - name
        - cardIds
      properties:
        deckId:
          type: string
        name:
          type: string
        cardIds:
          type: array
          items:
            type: string

    FlashCard:
      type: object
      properties:
        id:
          type: integer
        front:
          type: string
        back:
          type: string

    OperationStatus:
      type: object
      properties:
        isSuccessful:
          type: boolean
        deckId:
          type: string
        flashCardId:
          type: string
        error:
          type: string
        timestamp:
          type: string